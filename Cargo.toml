[workspace]
members = ["crates/shell-core", "crates/trinedocs"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dist]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = true
panic = "abort"
