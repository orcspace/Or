[package]
name = "trinedocs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "TrineDocs"

[lints]
workspace = true

[[bin]]
name = "TrineDocs"
path = "src/main.rs"

[[bin]]
name = "trinedocs-mcp"
path = "src/bin/trinedocs-mcp.rs"

[dependencies]
shell-core = { package = "trinedocs-shell-core", path = "../shell-core" }
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "accesskit"] }
egui = { version = "=0.36.2", default-features = false, features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
quick-xml = "=0.42.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
calamine = "=0.36.1"
rust_xlsxwriter = "=0.99.1"
pdf-writer = "=0.15.0"
ttf-parser = "=0.25.1"
subsetter = "=0.2.6"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
rfd = { version = "=0.17.2", default-features = false }
arboard = { version = "=3.6.1", default-features = false, features = ["image-data"] }
encoding_rs = "=0.8.42"
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
getrandom = "=0.4.3"
rmcp = { version = "=3.5.0", features = ["server", "client", "transport-io", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-std", "process"] }
axum = "=0.8.9"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }

toml_edit = "=0.25.15"
