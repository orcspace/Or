name: diag
on:
  push:
    branches: [diag-tests]
jobs:
  t:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - name: lint
        shell: pwsh
        continue-on-error: true
        run: |
          $f = (cargo fmt --all -- --check 2>&1 | Out-String)
          if ($f) { $m = ($f -replace '\r','' -replace '%','%25' -replace "`n",'%0A'); if ($m.Length -gt 3000) { $m = $m.Substring(0,3000) }; Write-Output "::error title=fmt::$m" }
          $c = (cargo clippy --locked --workspace --all-targets -- -D warnings 2>&1 | Out-String)
          $errs = [regex]::Matches($c, '(?m)^(error|warning)(\[.*?\])?: .*\r?\n\s+--> .*')
          $k=0; foreach ($e in $errs) { $k++; if ($k -gt 8) { break }; $m = ($e.Value -replace '\r','' -replace '%','%25' -replace "`n",'%0A'); Write-Output "::error title=clippy::$m" }      - name: test
        shell: pwsh
        run: |
          cargo test --locked -p trinedocs --lib 2>&1 | Out-File t.log -Encoding utf8
          $t = Get-Content t.log -Raw
          $blocks = [regex]::Matches($t, '(?s)---- (\S+) stdout ----\r?\n(.*?)(?=\r?\n---- |\r?\nfailures:)')
          $i = 0
          foreach ($b in $blocks) { $i++; $m = ($b.Groups[2].Value -replace '\r','' -replace '%','%25' -replace "`n",'%0A'); if ($m.Length -gt 1500) { $m = $m.Substring(0,1500) }; Write-Output "::error title=$($b.Groups[1].Value)::$m" }
          "blocks=$i"

