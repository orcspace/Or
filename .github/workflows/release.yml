name: Windows preview release
on:
  workflow_dispatch:
  push:
    branches: [codex/native-office-preview]
    tags: ['v*']
  pull_request:
    paths: ['crates/**', 'Cargo.*', 'rust-toolchain.toml', '.cargo/**', 'installer/**', 'tools/**', '.github/workflows/release.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable 2026-09-12
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/spec_registry.py check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Build unsigned installer
        shell: pwsh
        run: |
          $version=if($env:GITHUB_REF_TYPE -eq 'tag'){$env:GITHUB_REF_NAME.TrimStart('v')}else{"0.0.1-preview.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"}
          tools/build_release.ps1 -Version $version
      - name: Install, file and MCP smoke, uninstall
        shell: pwsh
        run: tools/test_installer.ps1 -SkipUI # Hosted VM: physical glow UI is checked separately
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Windows-preview
          path: |
            dist/
            target/installer-smoke/
          if-no-files-found: error
  publish:
    needs: windows
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Windows-preview
          path: artifact
      - name: Publish unsigned pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          tag="v0.0.1-preview.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          if [[ "$RELEASE_REF_TYPE" == 'tag' ]]; then tag="$RELEASE_REF_NAME"; fi
          # Plain version tags (v0.0.1) are stable releases; anything with a suffix stays a pre-release.
          kind=(--prerelease --title "TrineDocs $tag — preview")
          notes=docs/audit/release-review.md
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind=(--latest --title "TrineDocs ${tag#v}")
            if [[ -f "docs/release-notes/$tag.md" ]]; then notes="docs/release-notes/$tag.md"; fi
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Refusing to replace an existing release: $tag" >&2
            exit 1
          fi
          gh release create "$tag" artifact/dist/TrineDocs-Setup.exe artifact/dist/SHA256SUMS.txt --target "$RELEASE_SHA" "${kind[@]}" --notes-file "$notes"
